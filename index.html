<head>

<meta name="theme-color" content="#0e1411" media="(prefers-color-scheme: dark)">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="mobile-web-app-capable" content="yes">

<title>ADIF · OEP 2026 — Simulador Montador Eléctrico</title>
<meta name="description" content="Simulador de exámenes ADIF OEP 2026 — Perfil 26/11PO Montador Eléctrico IISS. 160 preguntas oficiales de convocatorias 2023, 2024 y 2025 + 1.062 del banco UGT Entre Raíles.">
<style>
/* ═══════════════ TOKENS ═══════════════ */
:root{
  color-scheme:light;
  --bg:#f3f5f2;
  --surface:#ffffff;
  --surface-2:#eef1ed;
  --seg-on:#ffffff;
  --ink:#15201a;
  --muted:#5b6a61;
  --line:#dde3de;
  --brand:#0b5d3b;
  --brand-ink:#ffffff;
  --accent:#e9a100;
  --ok:#1b8a4b;
  --ok-bg:#e3f4e9;
  --bad:#c23b2e;
  --bad-bg:#fbe6e3;
  --shadow:0 1px 2px rgba(16,32,24,.06),0 4px 16px rgba(16,32,24,.06);
  --r:14px;
  --nav-h:64px;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    color-scheme:dark;
    --bg:#0e1411;
    --surface:#161e1a;
    --surface-2:#1e2823;
    --seg-on:#34453c;
    --ink:#e7eee9;
    --muted:#9aaba1;
    --line:#2a3630;
    --brand:#35b577;
    --brand-ink:#08140e;
    --accent:#f0b429;
    --ok:#3ccf7d;
    --ok-bg:#15301f;
    --bad:#ff6b5b;
    --bad-bg:#3a1a16;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25);
  }
}

/* ═══════════════ BASE ═══════════════ */
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  font:16px/1.5 var(--font);
  color:var(--ink);
  background:var(--bg);
  min-height:100dvh;
  -webkit-tap-highlight-color:transparent;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:760px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right))}

/* ═══════════════ CABECERA ═══════════════ */
.top{
  background:var(--brand);
  color:#fff;
  padding-top:env(safe-area-inset-top);
}
@media (prefers-color-scheme: dark){ .top{background:#0b2a1c} }
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.logo{
  flex:none;font-weight:800;font-size:18px;letter-spacing:-.02em;
  background:#fff;color:#0b5d3b;border-radius:8px;padding:2px 8px;line-height:1.4;
}
.titles{flex:1;min-width:0}
.titles h1{font-size:17px;font-weight:700;line-height:1.2}
.titles p{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pill{
  flex:none;text-align:right;font-size:12px;line-height:1.25;opacity:.95;
  font-variant-numeric:tabular-nums;
}
.pill b{font-size:15px;display:block}

/* ═══════════════ NAVEGACIÓN ═══════════════ */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;
  display:flex;justify-content:center;
  background:color-mix(in srgb,var(--surface) 92%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tabs button{
  flex:1;max-width:200px;height:var(--nav-h);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-size:12px;font-weight:600;color:var(--muted);
}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-selected="true"]{color:var(--brand)}

/* ═══════════════ FILTROS ═══════════════ */
.filters{display:flex;flex-direction:column;gap:8px;padding-block:14px 4px}
.seg{
  display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:12px;
  overflow-x:auto;scrollbar-width:none;
}
.seg::-webkit-scrollbar{display:none}
.seg button{
  flex:1;white-space:nowrap;padding:7px 10px;border-radius:9px;
  font-size:14px;font-weight:600;color:var(--muted);
}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .seg{flex:1;min-width:220px}
.toggle{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:12px;
  background:var(--surface-2);font-size:14px;font-weight:600;color:var(--muted);white-space:nowrap;
}
.toggle[aria-pressed="true"]{background:var(--bad-bg);color:var(--bad)}
.search{
  width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--line);
  background:var(--surface);font-size:16px;
}

/* ═══════════════ TARJETA DE PREGUNTA ═══════════════ */
[hidden]{display:none!important}
.progress{
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  font-size:13px;color:var(--muted);padding-block:10px 8px;font-variant-numeric:tabular-nums;
}
.progress b{color:var(--ink)}
.track{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.track i{display:block;height:100%;background:var(--brand);border-radius:4px;transition:width .3s ease}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);padding:18px;
}
.qcard{animation:in .18s ease-out}
@keyframes in{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;font-size:12px;color:var(--muted)}
.tag{
  font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:uppercase;
  padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted);
}
.tag.ing{background:#e6eefb;color:#2553a6}
.tag.esp{background:#fdf1d8;color:#8a5a00}
@media (prefers-color-scheme: dark){
  .tag.ing{background:#1a2740;color:#8fb3f5}
  .tag.esp{background:#35290f;color:#f0c46a}
}
.qtext{font-size:18px;font-weight:600;line-height:1.4;margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);
  background:var(--surface);font-size:16px;line-height:1.4;
  transition:border-color .12s,background .12s,transform .08s;
}
button.opt:not(:disabled):hover{border-color:var(--brand)}
button.opt:not(:disabled):active{transform:scale(.99)}
.opt .k{
  flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:13px;font-weight:700;background:var(--surface-2);color:var(--muted);
}
.opt.correct{border-color:var(--ok);background:var(--ok-bg)}
.opt.correct .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.verdict{margin-top:14px;font-size:15px;font-weight:600}
.verdict.good{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.verdict:empty{display:none}

/* ═══════════════ ACCIONES ═══════════════ */
.actions{
  position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom));
  display:flex;gap:8px;padding-block:12px;
  background:linear-gradient(transparent,var(--bg) 30%);
}
.btn{
  flex:1;padding:14px 16px;border-radius:12px;font-weight:700;font-size:16px;
  background:var(--brand);color:var(--brand-ink);
  transition:opacity .15s,transform .08s;
}
.btn:active:not(:disabled){transform:scale(.98)}
.btn:disabled{opacity:.35}
.btn.ghost{flex:none;background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--bad-bg);color:var(--bad)}
.hint{text-align:center;font-size:12px;color:var(--muted);padding-bottom:8px}
@media (hover:none){ .hint{display:none} }
kbd{font:600 11px var(--font);padding:1px 5px;border-radius:4px;border:1px solid var(--line);background:var(--surface)}
.empty{text-align:center;color:var(--muted);padding:40px 16px}

/* ═══════════════ ESTUDIO ═══════════════ */
.list{display:flex;flex-direction:column;gap:12px;padding-block:12px 24px}
.list .qtext{font-size:16px;margin-bottom:12px}
.list .opt{padding:9px 12px;font-size:15px;border-width:1px}
.list .shown .opt.ans,.list.all .opt.ans{border-color:var(--ok);background:var(--ok-bg)}
.list .shown .opt.ans .k,.list.all .opt.ans .k{background:var(--ok);color:#fff}
.sa{display:flex;gap:8px;margin-top:12px}
.mini{
  padding:7px 12px;border-radius:10px;font-size:13px;font-weight:600;
  background:var(--surface-2);color:var(--muted);
}
.mini.on{background:var(--ok-bg);color:var(--ok)}
.card.mastered{border-color:var(--ok)}
.count{font-size:13px;color:var(--muted);padding-top:8px}

/* ═══════════════ PROGRESO ═══════════════ */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding-block:16px 12px}
.kpi{text-align:center;padding:14px 8px}
.kpi b{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.block{margin-bottom:12px}
.block h3{font-size:15px;margin-bottom:10px}
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:13px;padding-block:6px}
.srow .y{color:var(--muted);font-weight:600}
.srow .n{color:var(--muted);font-variant-numeric:tabular-nums;text-align:right;min-width:92px}
.bar{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .m{background:var(--ok)}
.bar .s{background:var(--accent)}
.legend{display:flex;gap:14px;justify-content:center;font-size:12px;color:var(--muted);padding-bottom:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.wipe{display:flex;justify-content:center;padding-block:16px 24px}


/* ═══════════════ FUENTE UGT ═══════════════ */
.seg.src button{display:flex;align-items:center;justify-content:center;gap:6px}
.seg.src small{font-size:11px;font-weight:700;opacity:.7;font-variant-numeric:tabular-nums}
.selects{flex-wrap:nowrap}
.sel{flex:1;min-width:0;padding:8px 10px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600;color:var(--ink)}
.sel:disabled{color:var(--muted);opacity:.7}
@media (max-width:520px){ .selects{flex-wrap:wrap} .sel{flex-basis:100%} }
.info{display:flex;flex-direction:column;gap:4px;margin-top:12px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--surface-2);border-radius:0 10px 10px 0;font-size:13px}
.info .ref{font-weight:700;font-variant-numeric:tabular-nums}
.info .note{color:var(--muted)}
.conf{align-self:flex-start;font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--ok-bg);color:var(--ok)}
.conf.cM{background:#fdf1d8;color:#8a5a00}
.conf.cB{background:var(--bad-bg);color:var(--bad)}
@media (prefers-color-scheme: dark){ .conf.cM{background:#35290f;color:#f0c46a} }
.list .reveal-info{display:none}
.list .shown .reveal-info,.list.all .reveal-info{display:block}
.subhead{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-top:8px}
.block.wide .srow{grid-template-columns:minmax(90px,130px) 1fr auto}

/* ═══════════════ MODOS · SIMULACRO · HOY ═══════════════ */
.modes{margin-top:12px}
.modes small{font-size:11px;font-weight:700;background:var(--accent);color:#1b1300;border-radius:9px;padding:0 6px;margin-left:4px;font-variant-numeric:tabular-nums}
.modehelp{font-size:12px;color:var(--muted);padding-top:6px;max-width:68ch}
.muted{color:var(--muted)}
.simcfg{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.simcfg .btn{flex:none}
.clock{font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink)}
.clock.low{color:var(--bad)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:12px}
.dots button{width:16px;height:16px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line)}
.dots button.a{background:var(--muted);border-color:var(--muted)}
.dots button.cur{outline:2px solid var(--accent);outline-offset:1px}
.opt.sel{border-color:var(--ink);background:var(--surface-2)}
.opt.sel .k{background:var(--ink);color:var(--bg)}
.list .opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.list .opt.wrong .k{background:var(--bad);color:#fff}
.simres{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.simres.pass{border-color:var(--ok)}
.simres.fail{border-color:var(--bad)}
.simres .srow,.block .srow{grid-template-columns:minmax(64px,130px) 1fr auto}
.todayline{font-size:14px;padding-top:6px}
.weakrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-top:1px solid var(--line);font-size:14px}
.weakrow:first-of-type{border-top:0}

@media (min-width:720px){
  .qtext{font-size:20px}
  .card{padding:24px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="logo" aria-hidden="true">adif</div>
    <div class="titles">
      <h1>Simulador OEP 2026</h1>
      <p id="h-sub">Montador Eléctrico IISS · 26/11PO · 25/09PO</p>

</header>

<main class="wrap">

  <!-- ═══════════ EXAMEN ═══════════ -->
  <section class="view" id="view-exam" role="tabpanel" aria-labelledby="tab-exam">

<script>

ición equitativa.","Presencia o composición equilibrada."],"a":3},{"id":"gen24-54","cat":"gen24","num":54,"q":"(Reserva) Según la Declaración sobre la Red 2025, ¿cuántos milímetros tiene la separación entre carriles en la red de ancho estándar?","opts":["1.668 mm.","1.535 mm.","1.568 mm.","1.435 mm."],"a":3},{"id":"gen25-37","cat":"gen25","num":37,"q":"Según la Declaración sobre la Red 2026 de Adif, ¿cuáles son los distintos anchos de vía de la red ferroviaria gestionada por Adif?","opts":["Ancho ibérico y ancho estándar, si bien algunas secciones cuentan con el denominado tercer carril.","Ancho ibérico, ancho estándar y ancho métrico, si bien algunas secciones cuentan con el denominado tercer carril.","Ancho estándar y ancho métrico, si bien algunas secciones cuentan con el denominado tercer carril.","Ancho de vía ancho, ancho estándar y ancho ibérico, si bien algunas secciones cuentan con el denominado tercer carril."],"a":1},{"id":"gen25-38","cat":"gen25","num":38,"q":"Según el capítulo II de la Declaración sobre la Red 2026 de Adif, ¿qué parámetros deben considerarse para determinar la carga máxima remolcable para cada locomotora?","opts":["La rampa característica más desfavorable de la línea y la carga máxima del remolque, en función de la rampa característica resultante.","La rampa característica más desfavorable del recorrido del tren y la carga máxima del remolque, en función de la rampa característica resultante.","La carga máxima de la locomotora, atendiendo a las especificaciones del fabricante, y la rampa característica más desfavorable de la línea.","La rampa característica más desfavorable del recorrido del tren y la carga máxima de las locomotoras, en función de la rampa característica resultante."],"a":3},{"id":"gen25-39","cat":"gen25","num":39,"q":"Según el Capítulo I de la Declaración sobre la Red 2026 de Adif, ¿cuáles son los principales agentes del sector ferroviario en España?","opts":["El Ministerio de Transportes y Movilidad Sostenible y los órganos colegiados adscritos al mismo (CIAF, CCTMP, CNTT, FRC), la Comisión Nacional del Mercado de Valores, la Agencia Estatal de Seguridad Ferroviaria y los administradores de infraestructuras Adif y Adif-Alta Velocidad.","El Ministerio de Transportes y Movilidad Sostenible y los órganos colegiados adscritos al mismo (CIAF, CCTMP, CNTT, FRC), la Comisión Nacional de los Mercados y de la Competencia, la Agencia Estatal de Seguridad Ferroviaria y los administradores de infraestructuras Adif y Adif-Alta Velocidad.","El Ministerio de Transportes y Movilidad Sostenible y los órganos colegiados adscritos al mismo (CIAF, CCTMP, CNTT, FRC), la Comisión Nacional de los Mercados y la Competencia, la Dirección General de Carreteras y los administradores de infraestructuras Adif y Adif-Alta Velocidad.","El Ministerio de Transportes y Movilidad Sostenible y los órganos colegiados adscritos al mismo (CIAF, CCTMP, CNTT, FRC), la Dirección General de Ferrocarriles, la Agencia Estatal de Seguridad Ferroviaria y los administradores de infraestructuras Adif y Adif-Alta Velocidad."],"a":1},{"id":"gen25-40","cat":"gen25","num":40,"q":"Según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, el órgano colegiado responsable de la coordinación de las políticas y medidas adoptadas por los departamentos ministeriales con la finalidad de garantizar el derecho a la igualdad entre mujeres y hombres y promover su efectividad se denomina:","opts":["Órgano Paritario de Igualdad entre mujeres y hombres.","Comisión Interministerial de Igualdad entre mujeres y hombres.","Órgano Colegiado de Igualdad entre mujeres y hombres.","Comisión Ejecutiva para la Promoción y el Desarrollo de la Igualdad entre mujeres y hombres."],"a":1},{"id":"gen25-41","cat":"gen25","num":41,"q":"¿Según la Ley 53/1984, en caso de compatibilidad de actividades públicas, qué requisito de los siguiente es necesario para su autorización?","opts":["Que la retribución de la segunda actividad que se solicita no sea superior a la primera.","Que el grupo de cotización en seguridad social de la segunda actividad sea el mismo.","Que la suma de total no supere la retribución de un Director General según Presupuestos Generales.","Que el solicitante no tenga infracciones tributarias abiertas."],"a":2},{"id":"gen25-42","cat":"gen25","num":42,"q":"Según se recoge en el Real Decreto Legislativo 5/2015, de 30 de octubre, por el que se aprueba el texto refundido de la Ley del Estatuto Básico del Empleado Público, de acuerdo con el artículo 54 del EBEP, con relación a las órdenes e instrucciones que reciba de sus superiores, el empleado público deberá:","opts":["Obedecer todas las instrucciones y órdenes profesionales recibidas, pues de lo contrario podrá ser sancionado.","Obedecer las instrucciones y órdenes profesionales de sus superiores, salvo que constituyan una infracción manifiesta del ordenamiento jurídico.","Obedecer aquellas instrucciones y órdenes profesionales recibidas, siempre que se las hayan hecho llegar por escrito.","Obedecer todas las instrucciones y órdenes profesionales recibidas, salvo que se encuentre de vacaciones."],"a":1},{"id":"gen25-43","cat":"gen25","num":43,"q":"Según su Estatuto, ¿por qué está integrado el patrimonio de ADIF?","opts":["El conjunto de bienes, derechos y obligaciones de los que sea titular.","La infraestructura ferroviaria que forma parte de la Red Ferroviaria de Interés General.","La infraestructura y superestructura ferroviarias de alta velocidad y de red convencional.","La infraestructura y superestructura ferroviarias y las estaciones y dependencias adscritas al ferrocarril."],"a":0},{"id":"gen25-44","cat":"gen25","num":44,"q":"Según el artículo 14.2 de la Ley 31/1995, ¿quién es responsable de garantizar la seguridad y salud de los trabajadores en todos los aspectos relacionados con el trabajo?","opts":["Los servicios de prevención ajenos.","La Inspección de Trabajo y Seguridad Social.","El empresario.","El delegado de prevención."],"a":2},{"id":"gen25-45","cat":"gen25","num":45,"q":"¿Cuáles son recursos económicos del ADIF conforme a su Estatuto?","opts":["Los derivados del transporte de viajeros.","Los derivados del transporte de mercancías.","Las tasas por la venta billetes.","Los cánones que perciba por la utilización de las infraestructuras ferroviarias."],"a":3},{"id":"gen25-46","cat":"gen25","num":46,"q":"Señale la opción INCORRECTA: Según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, las Administraciones educativas, en el ámbito de sus respectivas competencias, para garantizar un igual derecho a la educación de mujeres y hombres a través de la integración activa, ¿cuál de las siguientes actuaciones desarrollarán?","opts":["La atención especial en los currículos y en todas las etapas educativas al principio de igualdad entre mujeres y hombres.","La integración del estudio y aplicación del principio de igualdad en los cursos y programas para la formación inicial y permanente del profesorado.","La eliminación y el rechazo de los comportamientos y contenidos sexistas y estereotipos que supongan discriminación indirecta entre mujeres y hombres, con especial consideración a ello en los libros de texto y materiales educativos.","La promoción de la presencia equilibrada de mujeres y hombres en los órganos de control y de gobierno de los centros docentes."],"a":2},{"id":"gen25-47","cat":"gen25","num":47,"q":"¿Qué función le corresponde a los administradores generales de infraestructuras ferroviarias según la Ley 38/2015, del Sector Ferroviario?","opts":["La administración de todas las infraestructuras ferroviarias independientemente de su titularidad.","La elaboración, aprobación y publicación de la declaración sobre la red.","La construcción con fondos propios de las infraestructuras ferroviarias de las comunidades autónomas.","La prestación de servicios comerciales de transporte ferroviario en la Red de Interés General."],"a":1},{"id":"gen25-48","cat":"gen25","num":48,"q":"Según el artículo 16.2 de la Ley 31/1995, ¿qué debe hacer el empresario respecto a la evaluación de riesgos laborales?","opts":["Delegar la evaluación en los trabajadores.","Evaluar solo los riesgos nuevos que aparezcan.","Realizar una evaluación inicial de los riesgos, actualizarla cuando cambien las condiciones de trabajo y revisarla si se han producido daños a la salud.","Evaluar los riesgos una vez al año."],"a":2},{"id":"gen25-49","cat":"gen25","num":49,"q":"Según la Ley 38/2015, del Sector Ferroviario, ¿en qué zonas se pueden realizar actividades industriales relacionadas con el ferrocarril?","opts":["En las zonas de reserva ferroviaria.","En las zonas de dominio ferroviario privado.","En las zonas de especial protección industrial.","En las zonas de servicio ferroviario."],"a":3},{"id":"gen25-50","cat":"gen25","num":50,"q":"Según el Estatuto del ADIF, ¿a quién le corresponde el control e inspección de las zonas de protección de la infraestructura ferroviaria?","opts":["Al Administrador de Infraestructuras Ferroviarias.","Al Ministerio de Fomento.","Al Ministerio del Interior.","A los operadores ferroviarios."],"a":0},{"id":"gen25-51","cat":"gen25","num":51,"q":"Según la Ley 38/2015, del Sector Ferroviario, ¿qué medidas se pueden adoptar en el caso de ejecución de obras no autorizadas en zona de protección de la infraestructura ferroviaria?","opts":["Imponer multas al responsable por el cuádruple del valor de la obra ilegal ejecutada.","Paralizar la actividad ilegal hasta que no se obtenga autorización municipal.","Ordenar la demolición de las obras o instalaciones prohibidas.","Permitir la continuación de las obras de manera cautelar."],"a":2},{"id":"gen25-52","cat":"gen25","num":52,"q":"(Reserva) ¿Qué efecto tiene la aprobación de un estudio informativo sobre una infraestructura ferroviaria según la Ley 38/2015, del Sector Ferroviario?","opts":["Implica la declaración de utilidad pública y necesidad de ocupación temporal de los terrenos a los solos efectos de la ocupación temporal de los terrenos para toma de datos y realización de prospecciones para la redacción de los proyectos.","Exime de la evaluación ambiental del proyecto.","Implica la autorización inmediata para iniciar las obras.","Permite la adjudicación directa de capacidad de infraestructura."],"a":0},{"id":"gen25-53","cat":"gen25","num":53,"q":"(Reserva) Según se indica en el Capítulo II de la Declaración sobre la Red 2026 de Adif, la integración del transporte por ferrocarril en Europa exige una compatibilidad técnica de la infraestructura, del material rodante y de la señalización, entre otras medidas, a través de las especificaciones técnicas de interoperabilidad. ¿Cuál de los siguientes sistemas de protección del tren cumple con esta compatibilidad?","opts":["LZB","ASFA","ERTMS","Bloqueo Automático"],"a":2},{"id":"gen25-54","cat":"gen25","num":54,"q":"(Reserva) Según la Ley Orgánica 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, estarán obligadas, en sus actividades y en las transacciones consiguientes, al cumplimiento del principio de igualdad de trato entre mujeres y hombres, evitando discriminaciones, directas o indirectas, por razón de sexo:","opts":["Todas las personas físicas o jurídicas que, en el sector público o en el privado, suministren bienes o servicios disponibles para el público, ofrecidos fuera del ámbito de la vida privada y familiar.","Las personas físicas que, en el sector público o en el privado, suministren bienes o servicios disponibles para la Administración Pública, ofrecidos fuera del ámbito de la vida privada y familiar.","Todas las personas físicas o jurídicas que, en el sector público o en el privado, suministren bienes o servicios disponibles para la Administración Pública, ofrecidos fuera del ámbito de la vida privada y familiar.","Todas las personas físicas o jurídicas que, en el sector público o en el privado, suministren bienes o servicios disponibles para el público, ofrecidos dentro del ámbito de la vida privada y familiar."],"a":0},{"id":"esp23-1","cat":"esp23","num":1,"q":"En aplicación del RD 223/2008, de 15 de febrero, indicar qué afirmación es correcta en relación al ámbito de aplicación:","opts":["A todas las líneas existentes antes de su entrada en vigor, sea cual sea su estado.","A las líneas de corriente alterna trifásica a 60 Hz.","Se aplica a las líneas eléctricas de alta tensión, entendiéndose como tales las de corriente alterna trifásica a 50 Hz de frecuencia, cuya tensión nominal eficaz entre fases sea superior a un kilovoltio.","Corriente alterna trifásica a 50 Hz de frecuencia, cuya tensión nominal eficaz entre fases sea superior a tres kilovoltios."],"a":2},{"id":"esp23-2","cat":"esp23","num":2,"q":"Según el RD 223/2008, la servidumbre de vuelo es la franja de terreno definida por la proyección sobre el suelo de los conductores extremos, más la distancia adicional de:","opts":["No se considera ninguna distancia adicional.","5 metros.","10 metros.","15 metros."],"a":0},{"id":"esp23-3","cat":"esp23","num":3,"q":"Según el RD 842/2002, para evitar el aumento de resistencia de las tomas de tierra debido a pérdida de humedad del suelo, presencia de hielo u otros efectos climáticos, su instalación se efectuará:","opts":["Se situará la toma de tierra a una profundidad mínima de 50 cm.","Se dispondrá sobre la toma de tierra elementos aislantes térmicamente.","Se deberá sobredimensionar la toma de tierra.","Todas son correctas."],"a":0,"ref":"ITC-BT-18, 3.1","note":"Clave revisada: el REBT solo establece que la profundidad nunca será inferior a 0,50 m. Las otras dos medidas no figuran en el texto, así que «Todas son correctas» no se sostiene."},{"id":"esp23-4","cat":"esp23","num":4,"q":"En aplicación del RD 842/2002, se define como punto neutro de un sistema polifásico aquel que:","opts":["En las condiciones de simulación, presenta la misma diferencia de potencial entre los polos o fases del sistema.","En las condiciones de funcionamiento previstas, presenta distinta diferencia de potencial.","En las condiciones de funcionamiento previstas, presenta la misma diferencia de potencial, con relación a las masas del sistema eléctrico.","En las condiciones de funcionamiento previstas, presenta la misma diferencia de potencial, con relación a cada uno de los polos o fases del sistema."],"a":3},{"id":"esp23-5","cat":"esp23","num":5,"q":"En el RD 223/2008 se define un seccionador como:","opts":["Aparato mecánico de conexión que, por razones de seguridad, en posición abierta asegura una distancia de seccionamiento que satisface unas condiciones específicas de aislamiento.","Aparato mecánico de desconexión del circuito.","Aparato de conexión capaz de establecer, de soportar y de interrumpir las corrientes del circuito.","Aparato de desconexión capaz de establecer y soportar corrientes en servicio normal."],"a":0},{"id":"esp23-6","cat":"esp23","num":6,"q":"Según el RD 337/2014, la saturación de un transformador de intensidad, ¿a qué variables puede afectar?","opts":["Potencia de precisión.","Relación de transformación.","Ángulo de fase.","Relación de transformación y ángulo de fase."],"a":3},{"id":"esp23-7","cat":"esp23","num":7,"q":"Según el RD 842/2002, ITC-BT-01, ¿cómo se define una instalación de puesta a tierra?","opts":["Conjunto de conexiones y dispositivos necesarios para poner a tierra, individual o colectivamente, un aparato o una instalación.","Conjunto de dispositivos necesarios para poner a tierra, colectivamente, un aparato o una instalación.","Las piezas metálicas que forman parte de las canalizaciones.","Conjunto de conexiones necesarias para poner a tierra, individualmente, cada aparato o instalación."],"a":0},{"id":"esp23-8","cat":"esp23","num":8,"q":"Según el RD 223/2008, en los cruzamientos de líneas aéreas, se situará a mayor altura:","opts":["La de mayor tensión eléctrica.","La de menor tensión eléctrica.","La última que se instale.","A igual tensión eléctrica, se acordará entre los propietarios de ambas líneas."],"a":0},{"id":"esp23-9","cat":"esp23","num":9,"q":"En el RD 337/2014, se define interruptor automático como:","opts":["Aparato de conexión capaz de establecer, de soportar y de interrumpir las corrientes en las condiciones normales del circuito, que pueden incluir las condiciones especificadas de sobrecarga en servicio, así como de soportar durante un tiempo especificado las corrientes en las condiciones anormales especificadas del circuito, tales como las de cortocircuito.","Interruptor que es capaz de interrumpir corrientes en condiciones anormales del circuito.","Interruptor en el que la apertura o cierre del circuito se produce automáticamente por variación de un parámetro predeterminado.","Aparato mecánico de conexión que, por razones de seguridad, en posición abierta asegura una distancia de seccionamiento."],"a":0},{"id":"esp23-10","cat":"esp23","num":10,"q":"Aplicando el RD 842/2002, se denomina acometida:","opts":["Las instalaciones que unen la caja general de protección con la derivación individual.","La parte de la instalación de la red de distribución que alimenta la caja o cajas generales de protección o unidad funcional equivalente.","La derivación individual de un abonado.","Las instalaciones interiores o receptoras."],"a":1},{"id":"esp23-11","cat":"esp23","num":11,"q":"Según el RD 337/2014, ¿en qué aparato el movimiento de los contactos debe ser independiente de la actuación del operador?","opts":["Seccionador.","Seccionador de puesta a tierra.","Conmutador.","Interruptor."],"a":3},{"id":"esp23-12","cat":"esp23","num":12,"q":"En aplicación del RD 223/2008, respecto a compatibilidad con otras instalaciones se afirma:","opts":["Las líneas eléctricas de alta tensión en su diseño y explotación quedan exentas de tener en cuenta criterios de compatibilidad.","Las líneas eléctricas de alta tensión deben estar dotadas de protecciones radioeléctricas exclusivas.","Las líneas eléctricas de alta tensión deben estar dotadas de los elementos necesarios para que su explotación e incidencias no produzcan perturbaciones anormales en el funcionamiento de otras instalaciones.","Las líneas quedan exceptuadas de compatibilidad en caso de incidencias."],"a":2},{"id":"esp23-13","cat":"esp23","num":13,"q":"Según el RCF, ¿cómo se define el cantón de bloqueo en BSL?","opts":["Tramo de vía comprendido entre señales que pueden presentar la indicación de parada y en el que, en circunstancias normales, solo puede haber un tren.","Parte de la vía comprendida entre dos estaciones colaterales abiertas a la circulación.","Parte de la vía comprendida entre dos señales consecutivas de bloqueo.","Tramo de vía comprendido entre dos señales de entrada."],"a":0},{"id":"esp23-14","cat":"esp23","num":14,"q":"En el RD 337/2014, ¿cuál es la definición de poner o conectar a tierra?","opts":["Es la conexión que tiene por objeto unir a tierra temporalmente parte de las instalaciones.","Unir eléctricamente un conductor al armazón de una máquina.","Es la conexión directa a tierra de las partes conductoras de los elementos de una instalación no sometidos normalmente a tensión eléctrica.","Unir eléctricamente con la tierra una parte del circuito eléctrico o una parte conductora no perteneciente al mismo por medio de la instalación de tierra."],"a":3},{"id":"esp23-15","cat":"esp23","num":15,"q":"En aplicación del estudio de calidad de la energía en el sistema eléctrico y su aplicación al sistema ferroviario, indicar cuál NO se corresponde con aspectos que se deben cumplir respecto a la Calidad del Servicio:","opts":["La continuidad del suministro, relativa al número y la duración de las interrupciones.","La calidad de la forma de onda de tensión, principalmente las variaciones del valor eficaz de la tensión y de la frecuencia.","Se establece un máximo de interrupciones para incidencias de interrupción superiores a 5 minutos.","La calidad de atención y relación con el cliente, en lo que se refiere a asesoramiento en materia de contratación."],"a":2},{"id":"esp23-16","cat":"esp23","num":16,"q":"En aplicación del RD 337/2014, ¿qué tipo de instalación es aquella destinada a la conexión entre dos o más circuitos y su maniobra?","opts":["Subestación.","Subestación de transformación.","Subestación de maniobra.","Subestación móvil."],"a":2},{"id":"esp23-17","cat":"esp23","num":17,"q":"En aplicación del RD 223/2008, ¿cómo se denomina a una tensión anormal en un lugar determinado de la red, relativamente larga y que no está amortiguada?","opts":["Sobretensión.","Sobretensión temporal.","Sobretensión tipo maniobra.","Sobretensión tipo rayo."],"a":1},{"id":"esp23-18","cat":"esp23","num":18,"q":"Según el RD 223/2008, si el punto de anclaje del cable de tierra a la torre está más alto que el del conductor, la flecha del cable de tierra respecto a la flecha de los conductores será:","opts":["Igual o mayor.","Inferior.","Igual o inferior.","Indiferente mientras se respete la distancia mínima de separación entre ellos."],"a":2},{"id":"esp24-1","cat":"esp24","num":1,"q":"En el RD 337/2014, ¿cómo se define la tensión nominal de una red trifásica?","opts":["Es la tensión asignada por el fabricante para el material.","Es el valor de la tensión especificada, que un aislamiento debe soportar.","Es el valor eficaz de una tensión alterna sinusoidal a frecuencia industrial.","Valor de la tensión entre fases por el cual se denomina la red, y a la cual se refieren ciertas características de servicio de la red."],"a":3},{"id":"esp24-2","cat":"esp24","num":2,"q":"Según el RD 842/2002, se clasifica como tensiones nominales usuales de corriente continua aquellas que están comprendidas entre:","opts":["Un ≤ 50 V","500 < Un ≤ 1000 V","750 < Un ≤ 1500 V","75 < Un ≤ 750 V"],"a":3},{"id":"esp24-3","cat":"esp24","num":3,"q":"Según el artículo 1.5.1.1 Señales y agujas del RCF, ¿en cuál de los siguientes sistemas de bloqueo podemos encontrar una señal preavanzada?","opts":["BA","BCA","BLA","BSL"],"a":2},{"id":"esp24-4","cat":"esp24","num":4,"q":"En el RD 337/2014 se define la Resistencia de Tierra como:","opts":["Es la resistencia entre un conductor y el suelo.","Es la resistencia entre las diferentes picas de tierra.","Es la resistencia entre el conductor neutro y el conductor de tierra.","Es la resistencia entre un conductor puesto a tierra y un punto de potencial cero."],"a":3},{"id":"esp24-5","cat":"esp24","num":5,"q":"En aplicación del RD 842/2002, ¿qué característica deben cumplir los Materiales de Clase II?","opts":["Material en el cual la protección contra el choque eléctrico no se basa únicamente en el aislamiento principal.","Material en el cual la protección contra el choque eléctrico no se basa en la alimentación a muy baja tensión.","Material en el cual la protección contra el choque eléctrico no se basa únicamente en el aislamiento principal, sino que comporta medidas de seguridad complementarias, tales como el doble aislamiento.","Material en el cual la protección contra el choque eléctrico no supone la utilización de puesta a tierra."],"a":2},{"id":"esp24-6","cat":"esp24","num":6,"q":"Según el RD 337/2014, para eliminación de sobretensiones en líneas de alta tensión se utiliza, entre otros:","opts":["Interruptores de desconexión automática.","Fusibles.","Autoválvulas.","Puestas a tierra."],"a":2},{"id":"esp24-7","cat":"esp24","num":7,"q":"En aplicación del RD 842/2002, las instalaciones eléctricas se ejecutarán por empresas instaladoras en baja tensión:","opts":["Que serán aquellas personas físicas, que con la titulación adecuada acrediten.","Que serán aquellas personas físicas o jurídicas que hayan presentado la declaración responsable de inicio de actividad según se establece en la correspondiente instrucción técnica complementaria.","Que serán aquellas personas físicas o jurídicas que estén inscritas en el registro de la Administración competente.","Que serán aquellas personas jurídicas que hayan presentado el informe de inicio de actividad."],"a":1},{"id":"esp24-8","cat":"esp24","num":8,"q":"El Reglamento electrotécnico para baja tensión aprobado en el RD 842/2002 es de aplicación para tensiones nominales de corriente alterna de:","opts":["Igual o inferior a 3.300 voltios.","Igual o inferior a 1.750 voltios.","Igual o inferior a 1.000 voltios.","Igual o inferior a 1.500 voltios."],"a":2},{"id":"esp24-9","cat":"esp24","num":9,"q":"Según el RD 223/2008, para una línea eléctrica de Alta Tensión, la distancia de los conductores a la rasante de una carretera no podrá ser en ningún caso menor a:","opts":["4 metros.","7 metros.","10 metros.","12 metros."],"a":1},{"id":"esp24-10","cat":"esp24","num":10,"q":"En aplicación del RD 223/2008, ¿qué afirmación es correcta respecto de las inspecciones periódicas de las líneas?","opts":["Se efectuarán inspecciones periódicas de las líneas. Estas inspecciones se realizarán cada cinco años, al menos.","Las inspecciones periódicas se realizarán por los organismos de instalación autorizados exclusivamente.","Se efectuarán inspecciones periódicas de las líneas. Estas inspecciones se realizarán cada tres años, al menos.","La Administración pública competente propondrá planes de inspección sin obligación de cumplimiento."],"a":2},{"id":"esp24-11","cat":"esp24","num":11,"q":"En aplicación del RD 223/2008, indicar la opción falsa teniendo en cuenta el Artículo 1 (Objeto):","opts":["Proteger las personas y la integridad y funcionalidad de los bienes.","Conseguir la necesaria regularidad en los suministros de energía eléctrica.","Establecer normas para hacer compatibles la extensa tipificación que existe en la fabricación de material eléctrico, así como las nuevas denominaciones que vayan apareciendo.","Facilitar desde la fase de proyecto de las líneas su adaptación a los futuros aumentos de carga."],"a":2},{"id":"esp24-12","cat":"esp24","num":12,"q":"En el RD 223/2008, se denomina tensión a tierra transferida:","opts":["Es la tensión de paso o de contacto que puede aparecer en un lugar cualquiera transmitida por un elemento metálico de la propia instalación.","Es la tensión de paso o de contacto que puede aparecer en un lugar cualquiera transmitida por un elemento metálico desde una instalación de tierra a cierta distancia.","Es la tensión entre elementos activos del sistema.","Es la tensión de paso o de contacto que puede aparecer en un lugar cualquiera transmitida por un elemento metálico desde una instalación de tierra lejana."],"a":3},{"id":"esp24-13","cat":"esp24","num":13,"q":"En el RD 223/2008, se define CONTACTO INDIRECTO como:","opts":["Contacto de personas o animales con partes que se han puesto en tensión.","Contacto de personas o animales con partes que se han puesto en tensión debido al uso de herramientas o útiles.","Contacto de personas o animales con partes que se han puesto en tensión por causas de terceros.","Contacto de personas o animales con partes que se han puesto en tensión como resultado de una falta de aislamiento."],"a":3},{"id":"esp24-14","cat":"esp24","num":14,"q":"Según el RD 223/2008, las líneas clasificadas de segunda categoría son aquellas cuya tensión nominal es:","opts":["Igual o inferior a 36 kV.","Igual o inferior a 40 kV y superior a 30 kV.","Igual o inferior a 66 kV y superior a 30 kV.","Inferior a 220 kV y superior a 66 kV."],"a":2},{"id":"esp24-15","cat":"esp24","num":15,"q":"Para el suministro en el ámbito ferroviario, ¿qué Norma Europea establece las principales características que han de cumplir las tensiones de alimentación?","opts":["IEEE 1159","IEC 61000-4-30","EN 50160","EN 50163"],"a":3},{"id":"esp24-16","cat":"esp24","num":16,"q":"En aplicación del RD 223/2008, ¿qué se entiende por tensión de defecto?","opts":["Es la parte de la tensión a tierra que aparece en caso de un defecto a tierra entre dos puntos del terreno separados a un metro.","Tensión que aparece a causa de un defecto de aislamiento, entre dos masas, entre una masa y un elemento conductor, o entre una masa y tierra.","Tensión que aparece a causa de un defecto de aislamiento, entre una masa y tierra.","Es la fracción de la tensión de puesta a tierra que puede ser puenteada por una persona entre la mano y un punto del terreno."],"a":1,"ref":"ITC-LAT 01, def. 87","note":"Clave revisada: el RLAT define la tensión de defecto como la que aparece a causa de un defecto de aislamiento entre dos masas, entre una masa y un elemento conductor, o entre una masa y tierra."},{"id":"esp24-17","cat":"esp24","num":17,"q":"En aplicación del RD 337/2014, ¿cuál de las siguientes afirmaciones es falsa respecto de especificaciones particulares de las instalaciones propiedad de las entidades de transporte y distribución de energía eléctrica?","opts":["En ningún caso estas especificaciones incluirán marcas o modelos de equipos.","Las empresas de transporte y distribución podrán establecer especificaciones particulares.","Estas especificaciones podrán variar en el territorio de distribución de la empresa distribuidora y podrán definir aspectos de diseño, materiales, construcción, montaje y puesta en servicio.","Una persona técnica competente certificará que las especificaciones particulares cumplen la normativa."],"a":2,"ref":"RD 337/2014 art. 14.1","note":"Clave revisada: la afirmación falsa es la c. Las especificaciones particulares «serán únicas para todo el territorio de distribución». La a es cierta: no pueden incluir marcas o modelos que aboquen a un único proveedor."},{"id":"esp24-18","cat":"esp24","num":18,"q":"En aplicación del RD 842/2002, indicar qué afirmación es la correcta:","opts":["Persona cualificada es aquella que teniendo una titulación homologada adecuada.","Persona cualificada es aquella que teniendo una experiencia mínima de tres años.","Se considera una persona cualificada aquella que está suficientemente informada.","Persona cualificada es aquella que, teniendo conocimientos técnicos o experiencia suficiente, puede evitar los peligros que pueda presentar la electricidad."],"a":3},{"id":"esp25-1","cat":"esp25","num":1,"q":"Considerando lo expuesto en el apartado 2 de la Instrucción Técnica Complementaria ITC-BT-18, del Real Decreto 842/2002, por el que se aprueba el Reglamento electrotécnico para baja tensión, con respecto a la definición de puesta o conexión a tierra, ¿cuál de las siguientes afirmaciones es correcta?","opts":["La puesta o conexión a tierra es la unión eléctrica mediante interruptores de protección, fusibles o aparamenta de funcionalidad equivalente de una parte del circuito eléctrico o de una parte conductora no perteneciente al mismo mediante una toma de tierra con un electrodo o grupos de electrodos enterrados en el suelo.","Mediante la instalación de puesta a tierra se deberá conseguir que en el conjunto de instalaciones, edificios y superficie próxima del terreno no aparezcan diferencias de potencial peligrosas y que, al mismo tiempo, impida el paso a tierra de las corrientes de defecto o las de descarga de origen atmosférico.","La puesta o conexión a tierra es la unión eléctrica directa, sin fusibles ni protección alguna, de una parte del circuito eléctrico o de una parte conductora no perteneciente al mismo mediante una toma de tierra con un electrodo o grupos de electrodos enterrados en el suelo.","Mediante la instalación de puesta a tierra se deberá conseguir que en el conjunto de instalaciones, edificios y superficie próxima del terreno aparezcan diferencias de potencial peligrosas y que, al mismo tiempo, permita el paso a tierra de las corrientes de defecto o las de descarga de origen atmosférico."],"a":2},{"id":"esp25-2","cat":"esp25","num":2,"q":"¿En qué límites de tensiones nominales resulta de aplicación el Reglamento, de acuerdo con el artículo 2.1 del Real Decreto 842/2002, por el que se aprueba el Reglamento electrotécnico para baja tensión?","opts":["Igual o inferior a 1.500 voltios en corriente alterna e igual o inferior a 1.000 voltios en corriente continua.","Igual o inferior a 1.000 voltios en corriente alterna e igual o inferior a 2.000 voltios en corriente continua.","Igual o inferior a 1.000 voltios en corriente alterna e igual o inferior a 1.500 voltios en corriente continua.","Superior a 1.000 voltios en corriente alterna y superior a 1.500 voltios en corriente continua."],"a":2},{"id":"esp25-3","cat":"esp25","num":3,"q":"En aplicación del Real Decreto 223/2008, de 15 de febrero, por el que se aprueba el Reglamento sobre condiciones técnicas y garantías de seguridad en líneas eléctricas de alta tensión, ¿qué afirmación de las siguientes es correcta al respecto del artículo 17 Documentación y puesta en servicio de las líneas propiedad de empresas de transporte y distribución de energía eléctrica?","opts":["Las empresas de transporte y distribución de energía eléctrica se responsabilizarán del proyecto de las líneas de su propiedad.","Las empresas de transporte y distribución de energía eléctrica se responsabilizarán de la ejecución de las líneas de su propiedad.","Las empresas de transporte y distribución de energía eléctrica se responsabilizarán de definir las características de instalación de las líneas de su propiedad.","Las empresas de transporte y distribución de energía eléctrica no podrán subcontratar la ejecución de las líneas de su propiedad."],"a":1},{"id":"esp25-4","cat":"esp25","num":4,"q":"En aplicación del Real Decreto 223/2008, de 15 de febrero, por el que se aprueba el Reglamento sobre condiciones técnicas y garantías de seguridad en líneas eléctricas de alta tensión, para líneas aéreas con cables unipolares aislados como criterio general, indicar cuál es la protección del cable contra sobretensiones indicada:","opts":["Se asegurará la protección del cable mediante la instalación de pararrayos en el inicio de cada cable unipolar. Asimismo, en caso de tramos de cables aislados insertados en las líneas aéreas desnudas, deberá instalarse pararrayos en las proximidades de los terminales de los cables.","Se asegurará la protección del cable mediante la instalación de pararrayos en los extremos de cada cable unipolar. Asimismo, en caso de tramos de cables aislados insertados en las líneas aéreas desnudas, se asegurará la protección del pararrayos con la continuidad de los terminales de los cables.","Se asegurará la protección del cable mediante la instalación de pararrayos en los extremos de cada cable unipolar. Asimismo, en caso de tramos de cables aislados insertados en las líneas aéreas desnudas, deberá instalarse pararrayos en las proximidades de los terminales de los cables.","Se asegurará la protección del cable mediante la instalación de pararrayos en el extremo final de cada cable unipolar. Asimismo, en caso de tramos de cables aislados insertados en las líneas aéreas desnudas, se asegurará la protección del pararrayos con la continuidad de los terminales de los cables."],"a":2},{"id":"esp25-5","cat":"esp25","num":5,"q":"En el Real Decreto 337/2014, de 9 de mayo, por el que se aprueba el Reglamento sobre condiciones técnicas y garantías de seguridad en instalaciones eléctricas de alta tensión, respecto a la documentación, puesta en servicio y mantenimiento de las instalaciones, indicar la proposición correcta:","opts":["Las instalaciones eléctricas de alta tensión que sean propiedad de entidades de producción, transporte y distribución de energía estarán sujetas al procedimiento de puesta en servicio descrito en la ITC-RAT 22, no siendo necesaria la autorización administrativa.","Las restantes instalaciones eléctricas de alta tensión que no sean propiedad de entidades de producción, transporte y distribución de energía eléctrica y que no vayan a ser cedidas estarán sujetas al procedimiento de puesta en servicio descrito en la ITC-RAT 22, no siendo necesaria la autorización administrativa.","Las restantes instalaciones eléctricas de alta tensión que no sean propiedad de entidades de producción, transporte y distribución de energía eléctrica y que no vayan a ser cedidas su puesta en servicio se condicionará al procedimiento de autorización establecido por la legislación sectorial vigente.","Las restantes instalaciones eléctricas de alta tensión que no sean propiedad de entidades de producción, transporte y distribución de energía eléctrica y que no vayan a ser cedidas estarán sujetas al procedimiento de puesta en servicio siendo necesaria la autorización administrativa."],"a":1},{"id":"esp25-6","cat":"esp25","num":6,"q":"¿Qué terminología se emplea en la Instrucción Técnica Complementaria ITC-LAT 01, del Real Decreto 223/2008, por el que se aprueban el Reglamento sobre condiciones técnicas y garantías de seguridad en líneas eléctricas de alta tensión y sus Instrucciones Técnicas Complementarias, para referirse al \"punto de un sistema polifásico que, en las condiciones de funcionamiento previstas, presenta la misma diferencia de potencial con relación a cada uno de los polos o fases del sistema\"?","opts":["Punto multifásico.","Punto neutro.","Punto de puesta a tierra.","Punto a potencial cero."],"a":1},{"id":"esp25-7","cat":"esp25","num":7,"q":"Atendiendo a lo expuesto en el artículo 1 del Real Decreto 842/2002, por el que se aprueba el Reglamento electrotécnico para baja tensión, ¿cuál de las siguientes es una de las finalidades de su objeto?","opts":["Asegurar el normal funcionamiento de las instalaciones y fomentar las perturbaciones en otras instalaciones y servicios.","Preservar la seguridad de las personas y los bienes.","Contribuir a la falibilidad en la técnica y a la eficiencia económica de las instalaciones.","Establecer condiciones técnicas y garantías que deben reunir las instalaciones eléctricas con frecuencia de red de 60 Hz."],"a":1},{"id":"esp25-8","cat":"esp25","num":8,"q":"En aplicación del Real Decreto 223/2008, de 15 de febrero, por el que se aprueba el Reglamento sobre condiciones técnicas y garantías de seguridad en líneas eléctricas de alta tensión, indicar la opción que se ajusta al Real Decreto al respecto de las intensidades admisibles como intensidades máximas permanentes en los conductores:","opts":["Para cada instalación, dependiendo de sus características, configuración, condiciones de funcionamiento, tipo de aislamiento, etc., el proyectista utilizará la tabla 6 de este apartado donde se indica la intensidad máxima permanente admisible del conductor, con el fin de no superar su temperatura máxima asignada.","Para cada instalación, en función de sus condiciones de funcionamiento, el proyectista justificará y calculará según la Norma UNE 21144 la intensidad máxima permanente admisible del conductor, con el fin de no superar su temperatura máxima asignada.","Para cada instalación, dependiendo de sus características, configuración, condiciones de funcionamiento, tipo de aislamiento, etc., el proyectista justificará y calculará según la Norma UNE 21144 la intensidad máxima de cortocircuito admisible del conductor, con el fin de no superar el límite mecánico del conductor.","Para cada instalación, dependiendo de sus características, configuración, condiciones de funcionamiento, tipo de aislamiento, etc., el proyectista justificará y calculará según la Norma UNE 21144 la intensidad máxima permanente admisible del conductor, con el fin de no superar su temperatura máxima asignada."],"a":3},{"id":"esp25-9","cat":"esp25","num":9,"q":"En el Real Decreto 223/2008, de 15 de febrero, por el que se aprueba el Reglamento sobre condiciones técnicas y garantías de seguridad en líneas eléctricas de alta tensión, teniendo en cuenta las prescripciones sobre cruzamientos, proximidades y paralelismos con los Ferrocarriles, indicar la opción que se ajusta a la norma:","opts":["Los cables se colocarán en canalizaciones entubadas hormigonadas, paralelas a la vía siempre que sea posible. La parte superior del tubo más próximo a la superficie quedará a una profundidad mínima de 1,1 metros respecto de la cara inferior de la traviesa. Dichas canalizaciones entubadas rebasarán las vías férreas en 1,5 metros por cada extremo.","Los cables se colocarán en canalizaciones entubadas hormigonadas, paralelas a la vía siempre que sea posible. La parte superior del tubo más próximo a la superficie quedará a una profundidad mínima de 1,1 metros respecto de la cara inferior de la traviesa. Dichas canalizaciones entubadas rebasarán las vías férreas en 3 metros por cada extremo.","Los cables se colocarán en galerías hormigonadas, perpendiculares a la vía siempre que sea posible. La parte superior de la galería quedará a una profundidad mínima de 1,1 metros respecto de la cara inferior de la traviesa. Dichas galerías rebasarán las vías férreas en 1,5 metros por cada extremo.","Los cables se colocarán en canalizaciones entubadas hormigonadas, perpendiculares a la vía siempre que sea posible. La parte superior del tubo más próximo a la superficie quedará a una profundidad mínima de 1,1 metros respecto de la cara inferior de la traviesa. Dichas canalizaciones entubadas rebasarán las vías férreas en 1,5 metros por cada extremo."],"a":3},{"id":"esp25-10","cat":"esp25","num":10,"q":"Según lo establecido en el artículo 1.5.1.23 del RCF, ¿cómo se considera un transporte cuando, debido a sus dimensiones, peso o acondicionamiento, debe realizarse con unas condiciones de transporte y unas prescripciones de circulación especiales?","opts":["Transporte Especial.","Transporte Excepcional.","Transporte Extraordinario.","Transporte Específico."],"a":1},{"id":"esp25-11","cat":"esp25","num":11,"q":"En aplicación del Real Decreto 337/2014, de 9 de mayo, por el que se aprueba el Reglamento sobre condiciones técnicas y garantías de seguridad en instalaciones eléctricas de alta tensión, señalar la opción correcta en la aplicación de los alumbrados especiales de emergencia:","opts":["En las instalaciones que tengan personal permanente para su servicio de maniobra, así como en aquellas otras que tengan visitas de forma continuada, deberán disponerse los medios propios de alumbrados especiales de emergencia.","En las instalaciones que tengan personal permanente para su servicio de maniobra, así como en aquellas otras que por su importancia lo requieran deberán disponerse los medios propios de alumbrados especiales de emergencia de acuerdo con el Reglamento Electrotécnico para Baja Tensión.","En las instalaciones que tengan personal permanente para su servicio de maniobra, así como en aquellas otras que por su importancia lo requieran deberán disponerse los medios propios de alumbrados especiales de emergencia de acuerdo al presente reglamento.","En las instalaciones que tengan personal permanente para su servicio de maniobra, así como en aquellas otras que por su importancia lo requieran deberán disponerse los medios propios de alumbrados especiales para indicar la presencia de equipos antiincendios y las salidas."],"a":1},{"id":"esp25-12","cat":"esp25","num":12,"q":"En aplicación del Real Decreto 223/2008, de 15 de febrero, por el que se aprueba el Reglamento sobre condiciones técnicas y garantías de seguridad en líneas eléctricas de alta tensión, cuál de las siguientes opciones se incluye en la definición de temperatura máxima admisible en los conductores:","opts":["Esta temperatura es función del tipo de aislamiento y del régimen de carga.","Para cables sometidos a ciclos de carga, las intensidades máximas admisibles serán inferiores a las correspondientes en servicio permanente.","Esta temperatura es función del tipo de aislamiento y del material del conductor.","Para cables sometidos a ciclos de carga, las intensidades máximas admisibles podrán ser superiores a las correspondientes de cortocircuito."],"a":0},{"id":"esp25-13","cat":"esp25","num":13,"q":"De acuerdo con lo establecido en el artículo 2.2 del Real Decreto 842/2002, por el que se aprueba el Reglamento electrotécnico para baja tensión, ¿a cuáles de las siguientes instalaciones aplicará el Reglamento?","opts":["A las nuevas instalaciones, a sus modificaciones y a sus ampliaciones.","A las instalaciones que distribuyan la energía eléctrica de t
